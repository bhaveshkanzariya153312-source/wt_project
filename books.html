<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Books - My Library</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div id="layout"></div>


<main class="content">

    <div class="page-header">

        <h2>Book Management</h2>

        <p>
            Add and manage books available in the library.
        </p>

    </div>


    <div class="card p-4 mb-4">

        <h5 class="mb-3">
            📚 Add New Book
        </h5>

        <form
            class="row g-3"
            onsubmit="addBook(event)">

            <div class="col-md-3">

                <label class="form-label">
                    Book Name
                </label>

                <input
                    id="bookName"
                    class="form-control"
                    placeholder="Enter book name"
                    required>

            </div>


            <div class="col-md-3">

                <label class="form-label">
                    Author
                </label>

                <input
                    id="author"
                    class="form-control"
                    placeholder="Enter author"
                    required>

            </div>


            <div class="col-md-2">

                <label class="form-label">
                    Category
                </label>

                <input
                    id="category"
                    class="form-control"
                    placeholder="Category"
                    required>

            </div>


            <div class="col-md-2">

                <label class="form-label">
                    Quantity
                </label>

                <input
                    id="quantity"
                    type="number"
                    min="1"
                    class="form-control"
                    placeholder="Quantity"
                    required>

            </div>


            <div class="col-md-2 d-flex align-items-end">

                <button
                    class="btn btn-primary w-100">

                    + Add Book

                </button>

            </div>

        </form>

    </div>


    <div class="card p-3">

        <div class="search-box mb-3">

            <span class="search-icon">
                🔎
            </span>

            <input
                id="bookSearch"
                onkeyup="showBooks()"
                class="form-control"
                placeholder="Search book, author or category...">

        </div>


        <div class="table-responsive">

            <table class="table table-hover">

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Book</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Available</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="bookTable"></tbody>

            </table>

        </div>

    </div>

</main>


<script src="js/app.js"></script>

<script>
    renderLayout('Books');
    showBooks();
</script>

</body>
</html>

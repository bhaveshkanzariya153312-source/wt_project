<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Issue Book</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div id="layout"></div>


<main class="content">

    <div class="page-header">

        <h2>Issue Book</h2>

        <p>
            Issue available books to registered students.
        </p>

    </div>


    <div id="issueMsg"></div>


    <div class="card p-4">

        <h5 class="mb-4">
            📖 Issue a Book
        </h5>

        <form
            onsubmit="issueBook(event)"
            class="row g-3">

            <div class="col-md-6">

                <label>
                    Student ID
                </label>

                <input
                    id="issueStudent"
                    type="number"
                    class="form-control"
                    placeholder="Enter student ID"
                    required>

            </div>


            <div class="col-md-6">

                <label>
                    Book ID
                </label>

                <input
                    id="issueBookId"
                    type="number"
                    class="form-control"
                    placeholder="Enter book ID"
                    required>

            </div>


            <div class="col-md-6">

                <label>
                    Due Date
                </label>

                <input
                    id="dueDate"
                    type="date"
                    class="form-control"
                    required>

            </div>


            <div class="col-12">

                <button
                    class="btn btn-primary">

                    📖 Issue Book

                </button>

            </div>

        </form>

    </div>


    <div class="page-header mt-5 mb-3">

        <h4>
            Currently Issued Books
        </h4>

    </div>


    <div class="card p-3">

        <div class="table-responsive">

            <table class="table table-hover">

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Student</th>
                        <th>Book</th>
                        <th>Issue Date</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="issueTable"></tbody>

            </table>

        </div>

    </div>

</main>


<script src="js/app.js"></script>

<script>
    renderLayout('Issue Book');
    showIssues();
</script>

</body>

</html>

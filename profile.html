<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>My Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div id="layout"></div>


<main class="content">

    <div class="page-header">

        <h2>My Profile</h2>

        <p>
            View your library account information.
        </p>

    </div>


    <div class="card p-4 profile-card">

        <div class="profile-avatar">
            👤
        </div>

        <h4>
            Demo Student
        </h4>

        <p class="text-muted mb-4">
            Computer Engineering Student
        </p>


        <div class="row g-3">

            <div class="col-md-6">

                <strong>
                    Student ID
                </strong>

                <div class="mt-1">
                    1
                </div>

            </div>


            <div class="col-md-6">

                <strong>
                    Name
                </strong>

                <div class="mt-1">
                    Demo Student
                </div>

            </div>


            <div class="col-md-6">

                <strong>
                    Email
                </strong>

                <div class="mt-1">
                    student@example.com
                </div>

            </div>


            <div class="col-md-6">

                <strong>
                    Course
                </strong>

                <div class="mt-1">
                    Computer Engineering
                </div>

            </div>

        </div>


        <div class="mt-4">

            <button class="btn btn-primary">
                Edit Profile
            </button>

        </div>

    </div>

</main>


<script src="js/app.js"></script>

<script>
    renderStudentLayout();
</script>

</body>

</html>

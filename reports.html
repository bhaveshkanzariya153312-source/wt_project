<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Reports</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div id="layout"></div>


<main class="content">

    <div class="page-header">

        <h2>Reports</h2>

        <p>
            Quick overview of library records.
        </p>

    </div>


    <div class="row g-4">

        <div class="col-sm-6 col-xl-3">

            <div class="card stat-card">

                <div class="card-body">

                    <div class="stat-icon mx-auto">
                        📚
                    </div>

                    <h5>Books</h5>

                    <h2 id="rBooks">
                        0
                    </h2>

                </div>

            </div>

        </div>


        <div class="col-sm-6 col-xl-3">

            <div class="card stat-card">

                <div class="card-body">

                    <div class="stat-icon mx-auto">
                        👨‍🎓
                    </div>

                    <h5>Students</h5>

                    <h2 id="rStudents">
                        0
                    </h2>

                </div>

            </div>

        </div>


        <div class="col-sm-6 col-xl-3">

            <div class="card stat-card">

                <div class="card-body">

                    <div class="stat-icon mx-auto">
                        📖
                    </div>

                    <h5>Issued</h5>

                    <h2 id="rIssued">
                        0
                    </h2>

                </div>

            </div>

        </div>


        <div class="col-sm-6 col-xl-3">

            <div class="card stat-card">

                <div class="card-body">

                    <div class="stat-icon mx-auto">
                        ↩️
                    </div>

                    <h5>Returned</h5>

                    <h2 id="rReturned">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>


    <div class="card welcome-panel p-4 mt-4">

        <h5>
            📊 Quick Report
        </h5>

        <p>
            Use Books, Students, Issue and Return pages
            to manage library records.
        </p>

    </div>

</main>


<script src="js/app.js"></script>

<script>
    renderLayout('Reports');
    showReports();
</script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Return Book</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div id="layout"></div>


<main class="content">

    <div class="page-header">

        <h2>Return Book</h2>

        <p>
            View currently issued books and process returns.
        </p>

    </div>


    <div class="card p-3">

        <div class="table-responsive">

            <table class="table table-hover">

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Student</th>
                        <th>Book</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="returnTable"></tbody>

            </table>

        </div>

    </div>

</main>


<script src="js/app.js"></script>

<script>
    renderLayout('Return Book');
    showReturn();
</script>

</body>

</html>

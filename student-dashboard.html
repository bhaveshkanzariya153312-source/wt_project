<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Student Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div id="layout"></div>


<main class="content">

    <div class="page-header">

        <h2>Student Dashboard</h2>

        <p>
            Welcome to your personal library dashboard.
        </p>

    </div>


    <div class="alert alert-primary">

        <strong>
            Welcome Student! 👋
        </strong>

        <br>

        Explore books and manage your library records
        from the sidebar.

    </div>


    <div class="row g-4">

        <div class="col-md-6">

            <div class="card stat-card dashboard-stat">

                <div class="card-body">

                    <div class="stat-icon mx-auto">
                        📚
                    </div>

                    <h5>
                        Available Books
                    </h5>

                    <h2 id="sdBooks">
                        0
                    </h2>

                </div>

            </div>

        </div>


        <div class="col-md-6">

            <div class="card stat-card dashboard-stat">

                <div class="card-body">

                    <div class="stat-icon mx-auto">
                        📖
                    </div>

                    <h5>
                        My Issued Books
                    </h5>

                    <h2 id="sdIssues">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="js/app.js"></script>

<script>

    renderStudentLayout();

    document.getElementById('sdBooks').innerText =
        getBooks().length;

    document.getElementById('sdIssues').innerText =
        getIssues().filter(
            x => x.status === 'Issued'
        ).length;

</script>

</body>

</html>

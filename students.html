<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Students - My Library</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div id="layout"></div>


<main class="content">

    <div class="page-header">

        <h2>Student Management</h2>

        <p>
            Manage students registered with the library.
        </p>

    </div>


    <div class="card p-4 mb-4">

        <h5 class="mb-3">
            👨‍🎓 Add New Student
        </h5>

        <form
            class="row g-3"
            onsubmit="addStudent(event)">

            <div class="col-md-3">

                <label class="form-label">
                    Student Name
                </label>

                <input
                    id="sname"
                    class="form-control"
                    placeholder="Student name"
                    required>

            </div>


            <div class="col-md-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    id="semail"
                    type="email"
                    class="form-control"
                    placeholder="Email address"
                    required>

            </div>


            <div class="col-md-2">

                <label class="form-label">
                    Phone
                </label>

                <input
                    id="sphone"
                    class="form-control"
                    placeholder="Phone number"
                    required>

            </div>


            <div class="col-md-2">

                <label class="form-label">
                    Course
                </label>

                <input
                    id="scourse"
                    class="form-control"
                    placeholder="Course"
                    required>

            </div>


            <div class="col-md-2 d-flex align-items-end">

                <button
                    class="btn btn-primary w-100">

                    + Add Student

                </button>

            </div>

        </form>

    </div>


    <div class="card p-3">

        <div class="table-responsive">

            <table class="table table-hover">

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="studentTable"></tbody>

            </table>

        </div>

    </div>

</main>


<script src="js/app.js"></script>

<script>
    renderLayout('Students');
    showStudents();
</script>

</body>

</html>
